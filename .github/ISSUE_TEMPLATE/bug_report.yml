name: Bug report
description: Something is broken, refused, or behaving differently than documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste serial numbers, IMEI, Android ID, MAC addresses, account emails, phone numbers
        or screenshots with personal data. Redact them first. For security issues, use SECURITY.md.
  - type: input
    id: device
    attributes:
      label: Device
      description: Brand, model and codename, e.g. Google Pixel 8 (shiba).
      placeholder: Google Pixel 8 (shiba)
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and build
      description: From `python tools/phone.py probe`, with the serial removed.
      placeholder: Android 16, BP2A.250705.008
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CleanYourPhone version
      description: Output of `python tools/phone.py --version`.
      placeholder: CleanYourPhone 0.1.0
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Profile
      description: The profile id or path used, or "none".
      placeholder: google-pixel-8
  - type: input
    id: command
    attributes:
      label: Command
      description: The exact command, with the serial redacted.
      placeholder: python tools/phone.py plan --profile google-pixel-8
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Include the exit code and the error text, with identifiers redacted.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Only the device/profile section. Redact the serial number.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I redacted the serial number, IMEI, Android ID, MAC addresses and personal data.
          required: true
        - label: I understand that disabling a package can break the phone and that `restore` is the undo.
          required: true
        - label: This is not a security issue (those go through SECURITY.md).
          required: true
