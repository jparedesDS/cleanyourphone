name: Publish to PyPI

# One-time setup before the first run:
# PyPI -> Publishing -> Add a new pending publisher
#   PyPI project: cleanyourphone
#   Owner: jparedesDS
#   Repository: cleanyourphone
#   Workflow name: publish.yml
#   Environment: pypi
#
# Then run this workflow manually from the Actions tab. The OIDC token is
# exchanged for a short-lived PyPI upload token; no API token is stored.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: build and publish
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cleanyourphone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
