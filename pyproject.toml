[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanyourphone"
dynamic = ["version"]
description = "Safe, reversible Android debloat over ADB. Disable, never uninstall."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jose Paredes", email = "jparedescolmenarejo@gmail.com" }]
keywords = ["android", "adb", "debloat", "cli", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
cleanyourphone = "cleanyourphone.phone:main"
cyp = "cleanyourphone.phone:main"

[project.urls]
Homepage = "https://cleanyourphone.org/"
Repository = "https://github.com/jparedesDS/cleanyourphone"
Changelog = "https://github.com/jparedesDS/cleanyourphone/blob/main/CHANGELOG.md"
Issues = "https://github.com/jparedesDS/cleanyourphone/issues"

[tool.setuptools]
packages = ["cleanyourphone"]
package-dir = { cleanyourphone = "tools" }

[tool.setuptools.dynamic]
version = { attr = "cleanyourphone.phone.VERSION" }

[tool.setuptools.data-files]
"share/cleanyourphone/profiles" = ["profiles/*/*.json"]
